name: BMW Wallbox Proxy (Multi-Meter)
version: "0.2.22"
slug: bmw_wallboxproxy_multimeter
description: Emulate an Inepro or Janitza Modbus meter for a BMW wallbox using Home Assistant sensor data.
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
  - i386
init: false
startup: application
boot: auto
stage: experimental
ingress: true
ingress_port: 8099
homeassistant_api: true
panel_title: BMW Wallbox Multi-Meter
panel_icon: mdi:ev-station
ports:
  502/tcp: 502
ports_description:
  502/tcp: BMW wallbox Modbus TCP listener
options:
  # Optional Home Assistant long-lived token. Supervisor mode uses the Supervisor token.
  ha_token: ""
  # Virtual meter profile. Must match the meter configured in the BMW Installation App.
  meter_model: inepro_pro380
  # Modbus framing expected by the proxy. Use rtu_over_tcp for a transparent RS485/TCP bridge.
  transport_mode: rtu_over_tcp
  # FLOAT32 word order used by Inepro PRO380/PRO2 profiles.
  float_word_order: abcd
  # Legacy register-address compatibility for Inepro profiles.
  register_alias_mode: exact
  # Home Assistant electrical measurement entities.
  u1_entity: ""
  u2_entity: ""
  u3_entity: ""
  i1_entity: ""
  i2_entity: ""
  i3_entity: ""
  p_total_entity: ""
  freq_entity: ""
  p1_entity: ""
  p2_entity: ""
  p3_entity: ""
  e_import_total_entity: ""
  e_export_total_entity: ""
  power_offset_entity: ""
schema:
  ha_token: "password?"
  meter_model: "list(inepro_pro380|inepro_pro2|janitza_b23)"
  transport_mode: "list(rtu_over_tcp|modbus_tcp)"
  float_word_order: "list(abcd|cdab)"
  register_alias_mode: "list(exact|alias_minus_1|alias_plus_1|alias_both)"
  u1_entity: "str?"
  u2_entity: "str?"
  u3_entity: "str?"
  i1_entity: "str?"
  i2_entity: "str?"
  i3_entity: "str?"
  p_total_entity: "str?"
  freq_entity: "str?"
  p1_entity: "str?"
  p2_entity: "str?"
  p3_entity: "str?"
  e_import_total_entity: "str?"
  e_export_total_entity: "str?"
  power_offset_entity: "str?"
watchdog: http://[HOST]:[PORT:8099]/api/state
timeout: 20
