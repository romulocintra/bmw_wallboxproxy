<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>{% block title %}BMW Meter Emulator{% endblock %}</title>
  <style>{{ inline_css | safe }}</style>
  <script>
    window.APP_PATHS = {
      dashboard: {{ dashboard_path|tojson }},
      settings: {{ settings_path|tojson }},
      apiState: {{ api_state_path|tojson }},
      apiTransportMode: {{ api_transport_mode_path|tojson }},
      apiFloatWordOrder: {{ api_float_word_order_path|tojson }},
      apiRegisterAliasMode: {{ api_register_alias_mode_path|tojson }},
      apiCompatibilityProfile: {{ api_compatibility_profile_path|tojson }},
      apiHaLiveData: {{ api_ha_live_data_path|tojson }}
    };
  </script>
  <script>{{ inline_js | safe }}</script>
</head>
<body data-page="{{ active_page }}">
  <div class="page-shell">
    <header class="topbar card">
      <div class="topbar-brand">
        <div class="eyebrow">BMW Wallbox Telemetry Bridge</div>
        <div class="topbar-title">Meter Emulator</div>
      </div>

      <button class="menu-toggle secondary" id="menu_toggle" type="button" aria-expanded="false" aria-controls="site_nav_panel">
        Menu
      </button>

      <nav class="nav-links" aria-label="Primary navigation">
        <a href="{{ dashboard_path }}" class="nav-link{% if active_page == 'dashboard' %} active{% endif %}">Dashboard</a>
        <a href="{{ settings_path }}" class="nav-link{% if active_page == 'settings' %} active{% endif %}">Settings</a>
      </nav>
    </header>

    <div class="menu-panel card" id="site_nav_panel" hidden>
      <a href="{{ dashboard_path }}" class="menu-link{% if active_page == 'dashboard' %} active{% endif %}">Dashboard</a>
      <a href="{{ settings_path }}" class="menu-link{% if active_page == 'settings' %} active{% endif %}">Settings</a>
    </div>

    <main class="wrap">
      {% block content %}{% endblock %}
    </main>
  </div>

</body>
</html>
