<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>{% block title %}BMW Wallboxproxy{% endblock %}</title>
  <style>{{ inline_css | safe }}</style>
  <script>
    (function () {
      const currentPath = window.location.pathname.replace(/\/+$/, '');
      const addonRoot = currentPath.endsWith('/settings')
        ? (currentPath.slice(0, -'/settings'.length) || '/')
        : (currentPath || '/');
      const root = addonRoot === '/' ? '' : addonRoot;

      window.APP_PATHS = {
        apiState: `${root}/api/state` || '/api/state',
        apiPowerOffset: `${root}/api/power_offset` || '/api/power_offset',
        apiPhaseOrder: `${root}/api/phase_order` || '/api/phase_order'
      };
    }());
  </script>
</head>
<body data-page="{{ active_page }}">
  <div class="page-shell">
    <header class="topbar card">
      <div class="topbar-brand">
        <div class="topbar-title">BMW Wallboxproxy</div>
      </div>
      <nav class="topbar-nav" aria-label="Primary navigation">
        <a href="{{ ingress_base_path }}"{% if active_page == 'dashboard' %} aria-current="page"{% endif %}>Dashboard</a>
        <a href="{{ ingress_base_path }}settings"{% if active_page == 'settings' %} aria-current="page"{% endif %}>Meter profile &amp; settings</a>
      </nav>
    </header>

    <main class="wrap">
      {% block content %}{% endblock %}
    </main>
  </div>
  <script>{{ inline_js | safe }}</script>
  <script src="{{ ingress_base_path }}static/tcp-log-tools.js"></script>

</body>
</html>
